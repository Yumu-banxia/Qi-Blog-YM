<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>页面不存在 · 语暮的技术手记</title>
  <meta name="description" content="这个地址没有对应的页面，可返回首页或浏览文章列表。">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120">
  <meta property="og:site_name" content="语暮的技术手记">
  <meta property="og:type" content="website">
  <meta property="og:title" content="页面不存在">
  <meta property="og:description" content="目标地址没有对应的内容，可返回首页或浏览文章列表。">
  <meta property="og:locale" content="zh_CN">
  <style>
    /* 样式内联，页面不请求任何外部资源：托管环境把未知地址交给本页时，
       无论请求路径落在哪一层，都能直接呈现，不依赖站点资源是否可达。 */
    :root {
      color-scheme: light dark;
      --bg: #f8f9fc;
      --surface: #eef1f7;
      --text: #182235;
      --muted: #566174;
      --border: #d5ddea;
      --accent: #d9a233;
      --accent-contrast: #182235;
      --link: #214f9b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #141d2d;
        --text: #edf1f7;
        --muted: #a3afc2;
        --border: #2c3850;
        --accent: #f0c675;
        --accent-contrast: #0b1120;
        --link: #a6c5ff;
      }
    }

    html {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.75;
    }

    a {
      color: var(--link);
    }

    a:visited {
      color: var(--link);
    }

    :focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: 1.5rem;
      top: -3rem;
      padding: 0.5rem 1rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0.5rem;
    }

    .wrap {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem;
      min-height: 4rem;
      padding: 0.5rem 1.5rem;
    }

    .brand {
      margin-inline-end: auto;
      color: var(--text);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-weight: 600;
      text-decoration: none;
    }

    .brand:visited {
      color: var(--text);
    }

    .site-nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .site-nav a {
      display: block;
      padding: 0.4rem 0.65rem;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
    }

    .site-nav a:hover {
      background-color: var(--surface);
    }

    main {
      position: relative;
      isolation: isolate;
      flex: 1;
      display: block;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: clamp(4rem, 12vh, 8rem) 1.5rem 7rem;
    }

    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset-block: 0;
      inset-inline-start: 50%;
      width: min(calc(100% + 40vw), 100vw);
      transform: translateX(-50%);
      background-image:
        radial-gradient(1px 1px at 24px 36px, var(--border) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 82px 104px, var(--border) 50%, transparent 51%);
      background-size: 120px 120px, 160px 160px;
      opacity: 0.7;
      pointer-events: none;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: clamp(2.25rem, 1.7rem + 2vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .lede {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.5rem 1.25rem;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
    }

    .actions li:first-child a {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-contrast);
    }

    .actions a:hover {
      border-color: var(--accent);
    }

    .site-footer {
      padding: 1.5rem;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" data-site-link>语暮的技术手记</a>
      <nav class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html" data-site-link>首页</a></li>
          <li><a href="pages/posts.html" data-site-link>文章</a></li>
          <li><a href="pages/works.html" data-site-link>作品</a></li>
          <li><a href="pages/archive.html" data-site-link>归档</a></li>
          <li><a href="pages/about.html" data-site-link>关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <h1>页面不存在</h1>
    <p class="lede">这个地址没有对应的页面，可能链接已过期，或者地址有误。</p>
    <ul class="actions">
      <li><a href="index.html" data-site-link>返回首页</a></li>
      <li><a href="pages/posts.html" data-site-link>浏览文章</a></li>
      <li><a href="pages/archive.html" data-site-link>查看归档</a></li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="wrap">© <span data-year>2026</span> 语暮的技术手记</div>
  </footer>

  <script>
    (function () {
      'use strict';

      var slots = document.querySelectorAll('[data-year]');
      var currentYear = String(new Date().getFullYear());
      for (var i = 0; i < slots.length; i += 1) {
        slots[i].textContent = currentYear;
      }

      /* 未知地址可能落在站点根，也可能落在静态托管给出的路径前缀之下，
         例如项目站点形式的 /<repository>/pages/missing。页面内的链接先按相对地址写，
         这里从当前目录逐级向上探测站点根，命中后把链接改到该前缀；
         探测不到或本地 file:// 打开时保持相对地址。 */
      if (location.protocol === 'file:') {
        return;
      }

      var path = location.pathname;
      var dir = path.substring(0, path.lastIndexOf('/') + 1);
      var segments = dir.split('/');
      var parts = [];
      for (var j = 0; j < segments.length; j += 1) {
        if (segments[j]) {
          parts.push(segments[j]);
        }
      }

      var candidates = [];
      var depth = Math.min(parts.length, 4);
      for (var level = depth; level >= 1; level -= 1) {
        candidates.push('/' + parts.slice(0, level).join('/') + '/');
      }
      candidates.push('/');

      var links = document.querySelectorAll('a[data-site-link]');

      function applyPrefix(prefix) {
        for (var k = 0; k < links.length; k += 1) {
          var href = links[k].getAttribute('href');
          if (href && href.charAt(0) !== '/' && href.indexOf('://') === -1) {
            links[k].setAttribute('href', prefix + href);
          }
        }
      }

      var probe = new Image();
      var index = 0;

      probe.onload = function () {
        applyPrefix(candidates[index]);
      };

      probe.onerror = function () {
        index += 1;
        if (index < candidates.length) {
          probe.src = candidates[index] + 'assets/icons/icon-192.png';
        }
      };

      probe.src = candidates[0] + 'assets/icons/icon-192.png';
    })();
  </script>
</body>
</html>
