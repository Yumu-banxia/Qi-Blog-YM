<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>页面不存在 · Qi 的个人博客</title>
  <meta name="description" content="这个地址没有对应的页面，可返回首页或浏览文章列表。">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:site_name" content="Qi 的个人博客">
  <meta property="og:type" content="website">
  <meta property="og:title" content="页面不存在">
  <meta property="og:description" content="目标地址没有对应的内容，可返回首页或浏览文章列表。">
  <meta property="og:locale" content="zh_CN">
  <style>
    /* 样式内联，页面不请求任何外部资源：托管环境把未知地址交给本页时，
       无论请求路径落在哪一层，都能直接呈现，不依赖站点资源是否可达。 */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #12172a;
      --muted: #525b73;
      --border: #dde2ee;
      --link: #1b4fd8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0e18;
        --text: #e7ecf7;
        --muted: #98a3bd;
        --border: #242c40;
        --link: #8fb4ff;
      }
    }

    html {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.75;
    }

    a {
      color: var(--link);
    }

    a:visited {
      color: var(--link);
    }

    :focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: 1.5rem;
      top: -3rem;
      padding: 0.5rem 1rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0.5rem;
    }

    .wrap {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 1.5rem;
      padding: 0.875rem 1.5rem;
    }

    .brand {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    .site-nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    main {
      display: block;
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.9rem;
      line-height: 1.3;
    }

    .lede {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .actions a {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }

    .site-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" data-site-link>Qi 的个人博客</a>
      <nav class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html" data-site-link>首页</a></li>
          <li><a href="pages/posts.html" data-site-link>文章</a></li>
          <li><a href="pages/works.html" data-site-link>作品</a></li>
          <li><a href="pages/archive.html" data-site-link>归档</a></li>
          <li><a href="pages/about.html" data-site-link>关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <h1>页面不存在</h1>
    <p class="lede">这个地址没有对应的页面，可能链接已过期，或者地址有误。</p>
    <ul class="actions">
      <li><a href="index.html" data-site-link>返回首页</a></li>
      <li><a href="pages/posts.html" data-site-link>浏览文章</a></li>
      <li><a href="pages/archive.html" data-site-link>查看归档</a></li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="wrap">© <span data-year>2026</span> Qi 的个人博客</div>
  </footer>

  <script>
    (function () {
      'use strict';

      var slots = document.querySelectorAll('[data-year]');
      var currentYear = String(new Date().getFullYear());
      for (var i = 0; i < slots.length; i += 1) {
        slots[i].textContent = currentYear;
      }

      /* 未知地址可能落在站点根，也可能落在静态托管给出的路径前缀之下，
         例如项目站点形式的 /<repository>/pages/missing。页面内的链接先按相对地址写，
         这里从当前目录逐级向上探测站点根，命中后把链接改到该前缀；
         探测不到或本地 file:// 打开时保持相对地址。 */
      if (location.protocol === 'file:') {
        return;
      }

      var path = location.pathname;
      var dir = path.substring(0, path.lastIndexOf('/') + 1);
      var segments = dir.split('/');
      var parts = [];
      for (var j = 0; j < segments.length; j += 1) {
        if (segments[j]) {
          parts.push(segments[j]);
        }
      }

      var candidates = [];
      var depth = Math.min(parts.length, 4);
      for (var level = depth; level >= 1; level -= 1) {
        candidates.push('/' + parts.slice(0, level).join('/') + '/');
      }
      candidates.push('/');

      var links = document.querySelectorAll('a[data-site-link]');

      function applyPrefix(prefix) {
        for (var k = 0; k < links.length; k += 1) {
          var href = links[k].getAttribute('href');
          if (href && href.charAt(0) !== '/' && href.indexOf('://') === -1) {
            links[k].setAttribute('href', prefix + href);
          }
        }
      }

      var probe = new Image();
      var index = 0;

      probe.onload = function () {
        applyPrefix(candidates[index]);
      };

      probe.onerror = function () {
        index += 1;
        if (index < candidates.length) {
          probe.src = candidates[index] + 'assets/icons/icon-192.png';
        }
      };

      probe.src = candidates[0] + 'assets/icons/icon-192.png';
    })();
  </script>
</body>
</html>
